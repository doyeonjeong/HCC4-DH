version: 1
preset: mobile # TODO: choose mobile or web.

project:
  name: "" # TODO: project name.
  purpose: "" # TODO: one-sentence product purpose.

pipeline: [P1, P2, G1, P3, G2, G3, P4]
retry:
  max_consecutive_failures: 3

figma:
  file_url: "" # TODO: add the project Figma URL after creating it.
  pages:
    system: Design System
    screens: Screens

components:
  max_count: 12
  max_variant_axes: 3
  required:
    - Button
    - Card
    - Checkbox
    - Dialog
    - Heading # Screen titles and section labels.
    - Input
    - Navigation
    - Radio
    - Select
    - Switch
    - Tabs
    - Badge
  interactive:
    - Button
    - Checkbox
    - Input
    - Radio
    - Select
    - Switch
    - Tabs
  text_required:
    - Heading
    - Badge
  center_text: [] # TODO: list components that require centered text.
  primary_action:
    component: Button
    property: type
    value: primary

screens: [] # TODO: add screen IDs and titles before G2.

tokens:
  colors:
    canvas: "#FFFFFF"
    surface: "#F5F6F8"
    text-primary: "#17191C"
    text-secondary: "#5E6672"
    border: "#D9DEE5"
    primary: "#315FE8"
  spacing:
    xxs: 4
    xs: 8
    sm: 12
    md: 16
    lg: 24
    xl: 32
    2xl: 48
    3xl: 64
  radii:
    none: 0
    sm: 8
    md: 12
    lg: 16
    xl: 24
    full: 9999
  typography:
    display: [32, 40, 700]
    heading: [24, 32, 700]
    body: [16, 24, 400]
    caption: [14, 20, 400]
  safe_area:
    variable: safe-area/top # Figma variable names cannot contain ".".
    bind_to: paddingTop

gates:
  G1:
    page: Design System
    checks:
      unbound_values: 0
      autolayout_off: 0
      text_not_centered: 0
      fixed_height_text: 0
      min_target_size: true # Actual minimum comes from presets/<preset>.yaml.
      component_count_max: 12
      variant_axes_max: 3
      required_components: 0
      text_required: 0
  G2:
    page: Screens
    checks:
      non_instance_elements: 0
      primary_action_per_screen_max: 1
      min_contrast: 4.5
      safe_area_binding: true
      invariants: [] # TODO: add frame invariants using the schema in harness/r5-gates.md.
